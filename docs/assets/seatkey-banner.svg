  <text x="252" y="187" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8b949e">Ed25519-signed offline activation</text>
  <rect x="560" y="176" width="12" height="12" fill="#39c5cf"/>
  <text x="582" y="187" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8b949e">single binary, no external DB</text>
