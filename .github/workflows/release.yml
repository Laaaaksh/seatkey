name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# A release run must never be cancelled mid-publish (assets/images can end up
# half-shipped), so overlapping runs queue instead: cancel-in-progress stays
# unset. Distinct tags are distinct refs and never share a group anyway; the
# guard covers the delete-and-re-push-same-tag race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  binaries:
    name: GoReleaser
    runs-on: ubuntu-latest
    # Fail hung jobs fast instead of burning the runner default (360m).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          scripts/release_notes.sh "$RUNNER_TEMP/release-notes.md" "${GITHUB_REF_NAME#v}"
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned so tagged releases cannot be broken by a future upstream
          # release that changes GoReleaser's config schema; bump this
          # deliberately after a snapshot drill, not by floating.
          version: v2.17.1
          args: release --clean --release-notes=${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/laaaaksh/seatkey:${{ github.ref_name }}
            ghcr.io/laaaaksh/seatkey:latest
