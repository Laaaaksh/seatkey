<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>democli</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0d1117;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .titlebar {
    background: #161b22; color: #8b949e; padding: 10px 16px;
    font-size: 13px; border-bottom: 1px solid #21262d;
  }
  .titlebar .dots { display: inline-block; margin-right: 10px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .dot.red { background: #ff5f56; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #27c93f; }
  #output {
    color: #c9d1d9; font-size: 16px; line-height: 1.55;
    padding: 18px 20px; white-space: pre-wrap; word-break: break-word;
    height: calc(100% - 40px); box-sizing: border-box; overflow: hidden;
  }
  .prompt { color: #58a6ff; }
  .ok { color: #3fb950; }
  .err { color: #f85149; }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></span>
    democli — reference license client
  </div>
  <div id="output"></div>
</body>
</html>
